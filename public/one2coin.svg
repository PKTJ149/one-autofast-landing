<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" fill="none" role="img" aria-label="ONE2Coin wallet placeholder">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#603ce3"/>
    </linearGradient>
  </defs>

  <!-- phone body -->
  <rect x="6" y="6" width="348" height="708" rx="48" fill="#ffffff"/>
  <rect x="6" y="6" width="348" height="708" rx="48" stroke="#e9e4f7" stroke-width="2"/>

  <!-- notch -->
  <rect x="140" y="26" width="80" height="10" rx="5" fill="#e9e4f7"/>

  <!-- balance card -->
  <rect x="30" y="64" width="300" height="168" rx="24" fill="url(#card)"/>
  <circle cx="292" cy="104" r="44" fill="#ffffff" opacity="0.12"/>
  <text x="54" y="106" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" opacity="0.7">ONE2Coin balance</text>
  <text x="54" y="150" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff">1,985,014</text>
  <rect x="54" y="176" width="112" height="34" rx="17" fill="#ffffff"/>
  <text x="80" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#603ce3">ฝากเงิน</text>
  <rect x="178" y="176" width="112" height="34" rx="17" fill="#ffffff" opacity="0.22"/>
  <text x="208" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">ถอนเงิน</text>

  <!-- coin badge -->
  <circle cx="292" cy="104" r="26" fill="url(#coin)"/>
  <text x="292" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">฿</text>

  <!-- section label -->
  <text x="30" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6b6386">รายการล่าสุด</text>

  <!-- transaction rows -->
  <g font-family="system-ui, sans-serif">
    <g>
      <rect x="30" y="292" width="300" height="72" rx="18" fill="#f5f1ff"/>
      <circle cx="66" cy="328" r="18" fill="#ffffff"/>
      <circle cx="66" cy="328" r="6" fill="#10b981"/>
      <text x="96" y="322" font-size="13" font-weight="600" fill="#17102e">ฝากผ่าน ONE2Coin</text>
      <text x="96" y="342" font-size="11" fill="#9d95b4">วันนี้ 09:24</text>
      <text x="310" y="334" text-anchor="end" font-size="14" font-weight="700" fill="#10b981">+12,500</text>
    </g>
    <g>
      <rect x="30" y="376" width="300" height="72" rx="18" fill="#f5f1ff"/>
      <circle cx="66" cy="412" r="18" fill="#ffffff"/>
      <circle cx="66" cy="412" r="6" fill="#ff6b2c"/>
      <text x="96" y="406" font-size="13" font-weight="600" fill="#17102e">ถอนเข้ากระเป๋า</text>
      <text x="96" y="426" font-size="11" fill="#9d95b4">วันนี้ 08:02</text>
      <text x="310" y="418" text-anchor="end" font-size="14" font-weight="700" fill="#ff6b2c">-4,900</text>
    </g>
    <g>
      <rect x="30" y="460" width="300" height="72" rx="18" fill="#f5f1ff"/>
      <circle cx="66" cy="496" r="18" fill="#ffffff"/>
      <circle cx="66" cy="496" r="6" fill="#7c3aed"/>
      <text x="96" y="490" font-size="13" font-weight="600" fill="#17102e">โอนระหว่างสมาชิก</text>
      <text x="96" y="510" font-size="11" fill="#9d95b4">เมื่อวาน 21:15</text>
      <text x="310" y="502" text-anchor="end" font-size="14" font-weight="700" fill="#17102e">3,000</text>
    </g>
  </g>

  <!-- summary strip -->
  <rect x="30" y="548" width="300" height="96" rx="20" fill="#17102e"/>
  <text x="54" y="584" font-family="system-ui, sans-serif" font-size="11" fill="#9d95b4">ค่าธรรมเนียมเดือนนี้</text>
  <text x="54" y="614" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">฿ 0.00</text>
  <rect x="234" y="574" width="72" height="28" rx="14" fill="#10b981" opacity="0.2"/>
  <text x="270" y="593" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">ประหยัด</text>

  <!-- home indicator -->
  <rect x="140" y="682" width="80" height="6" rx="3" fill="#e9e4f7"/>
</svg>
